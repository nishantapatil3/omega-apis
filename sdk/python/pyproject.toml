[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omega-apis-sdk"
version = "0.0.0"
description = "Generated Python SDK for the Omega APIs proto schema"
requires-python = ">=3.9"
dependencies = [
    "grpcio>=1.60",
    "protobuf>=4.25",
]

[tool.setuptools.packages.find]
include = ["omega*"]
